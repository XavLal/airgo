name: Keep Supabase awake

on:
  schedule:
    # Tous les jours à 05:00 UTC. Marge large avant la pause des 7 jours,
    # même si GitHub décale un run.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lecture réelle de la table spots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Secrets SUPABASE_URL et SUPABASE_ANON_KEY manquants."
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/spots?select=id&limit=1"
          code=$(curl -sS -o /tmp/supabase-ping.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "$url")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Ping échoué (HTTP ${code})"
            cat /tmp/supabase-ping.json
            exit 1
          fi
          echo "Ping OK (HTTP ${code})"
